[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndr-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pandas>=2.2,<3",
  "openpyxl>=3.1,<4", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1", "pyyaml>=6,<7", "apscheduler>=3.10,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
